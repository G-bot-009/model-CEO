<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>เข้าสู่ระบบ · Office</title>
<link rel="stylesheet" href="/tailwind.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --font-sans: 'Inter', ui-sans-serif, system-ui, sans-serif; }
  body { font-family: var(--font-sans); }
  @keyframes dropIn { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
  .drop-in { opacity: 0; animation: dropIn 0.6s cubic-bezier(.2,.7,.2,1) forwards; }
</style>
</head>
<body>
<div class="relative text-neutral-900 font-sans selection:bg-[#EAECE9] selection:text-[#1C2E1E] antialiased overflow-hidden min-h-screen" style="background:#ECEBF4">

  <!-- background character video — shifted to sit centered behind the form;
       scaled enough to leave no gap, on a matching backdrop colour -->
  <div class="fixed inset-0 z-0 overflow-hidden pointer-events-none" style="background:#ECEBF4">
    <video id="bgvid" muted playsinline preload="auto"
      class="w-full h-full object-cover object-center"
      style="transform: translateX(-20%) scale(1.45); transform-origin:center;"
      src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260601_110537_3a579fa0-7bbc-4d94-9d25-0e816c7840f5.mp4"></video>
  </div>

  <!-- login form — centered, over the character's chest -->
  <div class="relative z-10 min-h-screen flex items-start justify-center px-6" style="padding-top:42vh">
    <form id="loginForm" class="drop-in w-full max-w-sm bg-white/85 backdrop-blur-md rounded-2xl shadow-2xl shadow-black/20 p-6">
      <div class="flex gap-1 mb-4 p-1 rounded-full bg-[#EDEFEC] text-sm font-medium">
        <button type="button" id="tabLogin" class="flex-1 py-2 rounded-full bg-white text-[#1C2E1E] shadow-sm">เข้าสู่ระบบ</button>
        <button type="button" id="tabSignup" class="flex-1 py-2 rounded-full text-[#738273]">สมัครสมาชิก</button>
      </div>
      <div id="rowName" style="display:none">
        <label class="block text-sm font-medium text-[#1C2E1E] mb-1">ชื่อ/ชื่อร้าน</label>
        <input id="lg_name" autocomplete="name" placeholder="เช่น ร้านของฉัน"
          class="w-full px-4 py-3 rounded-xl bg-white border border-[#E2E6E1] text-[#1C2E1E] mb-4 outline-none focus:border-[#1C2E1E] transition-colors" />
      </div>
      <label class="block text-sm font-medium text-[#1C2E1E] mb-1">อีเมล</label>
      <input id="lg_user" autocomplete="username" placeholder="you@email.com"
        class="w-full px-4 py-3 rounded-xl bg-white border border-[#E2E6E1] text-[#1C2E1E] mb-4 outline-none focus:border-[#1C2E1E] transition-colors" />
      <label class="block text-sm font-medium text-[#1C2E1E] mb-1">รหัสผ่าน</label>
      <input id="lg_pass" type="password" autocomplete="current-password" placeholder="••••••"
        class="w-full px-4 py-3 rounded-xl bg-white border border-[#E2E6E1] text-[#1C2E1E] mb-5 outline-none focus:border-[#1C2E1E] transition-colors" />
      <label id="rowTos" for="lg_tos" style="display:none" class="flex items-start gap-2 mb-4 text-xs text-[#1C2E1E] cursor-pointer">
        <input id="lg_tos" type="checkbox" class="mt-0.5 shrink-0" />
        <span>ฉันยอมรับ <a href="/terms" target="_blank" rel="noopener" class="underline">ข้อกำหนดการใช้งาน</a>
          และ <a href="/privacy" target="_blank" rel="noopener" class="underline">นโยบายความเป็นส่วนตัว</a>
          — ใช้บริการอย่างถูกกฎหมาย ห้ามพนัน/ผิดกฎหมาย และรับผิดชอบเนื้อหาของตนเอง</span>
      </label>
      <button type="submit"
        class="w-full inline-flex items-center justify-center gap-2 px-6 py-3 rounded-full bg-[#1C2E1E] text-white font-medium shadow-md hover:opacity-90 transition-opacity">
        <span id="lg_btn_label">เข้าสู่ระบบ</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" class="w-4 h-4"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>
      <p id="lg_err" class="text-sm text-red-600 mt-3 text-center" style="display:none"></p>
      <p id="lg_hint" class="text-xs text-[#738273] mt-4 text-center">บัญชีของคุณแยกข้อมูล/คีย์/Facebook App เป็นของตัวเอง</p>
    </form>
  </div>
</div>

<script>
  /* background video: desktop = smooth mouse-position scrubbing (eased), mobile = autoplay */
  const video = document.getElementById("bgvid");
  let targetTime = 0, curTime = 0, seeking = false, rafOn = false;
  function onMove(e){
    if (window.innerWidth < 1024 || !video.duration) return;
    // map mouse X (absolute position) → timeline — predictable, no drift
    const x = Math.max(0, Math.min(1, e.clientX / window.innerWidth));
    targetTime = x * video.duration;
    if (!rafOn){ rafOn = true; requestAnimationFrame(tick); }
  }
  function tick(){
    if (!video.duration){ rafOn = false; return; }
    curTime += (targetTime - curTime) * 0.12;          // ease toward target for a smooth glide
    const done = Math.abs(targetTime - curTime) < 0.012;
    if (done) curTime = targetTime;
    if (!seeking){                                       // only issue a new seek once the last finished
      seeking = true;
      try { video.currentTime = curTime; } catch(_){}
    }
    if (!done) requestAnimationFrame(tick); else rafOn = false;
  }
  video.addEventListener("seeked", () => {
    seeking = false;
    if (rafOn && Math.abs(targetTime - curTime) > 0.012){ requestAnimationFrame(tick); }
  });
  function setupPlayback(){
    if (window.innerWidth < 1024) { video.autoplay = true; video.muted = true; video.play().catch(()=>{}); }
    else { try { video.pause(); video.currentTime = 0; curTime = targetTime = 0; } catch(_){} }
  }
  video.addEventListener("loadedmetadata", setupPlayback);
  window.addEventListener("mousemove", onMove);
  window.addEventListener("resize", setupPlayback);

  /* login / signup */
  const form = document.getElementById("loginForm");
  const errEl = document.getElementById("lg_err");
  let mode = "login";
  const tabL = document.getElementById("tabLogin"), tabS = document.getElementById("tabSignup");
  function setMode(m){
    mode = m; errEl.style.display = "none";
    const on = "flex-1 py-2 rounded-full bg-white text-[#1C2E1E] shadow-sm";
    const off = "flex-1 py-2 rounded-full text-[#738273]";
    tabL.className = m==="login"?on:off; tabS.className = m==="signup"?on:off;
    document.getElementById("rowName").style.display = m==="signup"?"block":"none";
    document.getElementById("rowTos").style.display = m==="signup"?"flex":"none";
    document.getElementById("lg_btn_label").textContent = m==="signup"?"สมัครสมาชิก":"เข้าสู่ระบบ";
    document.getElementById("lg_pass").autocomplete = m==="signup"?"new-password":"current-password";
    document.getElementById("lg_hint").textContent = m==="signup"
      ? "สมัครฟรี — บัญชีของคุณแยกข้อมูล/คีย์/Facebook App เป็นของตัวเอง"
      : "บัญชีของคุณแยกข้อมูล/คีย์/Facebook App เป็นของตัวเอง";
  }
  tabL.addEventListener("click", () => setMode("login"));
  tabS.addEventListener("click", () => setMode("signup"));
  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    errEl.style.display = "none";
    const email = document.getElementById("lg_user").value.trim();
    const password = document.getElementById("lg_pass").value;
    const name = document.getElementById("lg_name").value.trim();
    const acceptTos = document.getElementById("lg_tos").checked;
    if (mode==="signup" && !acceptTos){
      errEl.textContent = "กรุณายอมรับข้อกำหนดการใช้งานก่อนสมัคร"; errEl.style.display = "block"; return;
    }
    const url = mode==="signup" ? "/api/signup" : "/api/login";
    try {
      const r = await fetch(url, {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email, username: email, password, name, accept_tos: acceptTos })
      });
      const d = await r.json();
      if (r.ok && d.ok) { window.location.href = "/"; }
      else { errEl.textContent = d.error || "ไม่สำเร็จ"; errEl.style.display = "block"; }
    } catch (_) { errEl.textContent = "เชื่อมต่อเซิร์ฟเวอร์ไม่ได้"; errEl.style.display = "block"; }
  });
</script>
</body>
</html>
