<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Multi-Agent Agentic OS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .dot-idle    { background:#94a3b8; }
    .dot-working { background:#f59e0b; box-shadow:0 0 0 0 rgba(245,158,11,.6); animation:pulse 1.4s infinite; }
    .dot-done    { background:#22c55e; }
    @keyframes pulse { 0%{box-shadow:0 0 0 0 rgba(245,158,11,.6)} 70%{box-shadow:0 0 0 8px rgba(245,158,11,0)} 100%{box-shadow:0 0 0 0 rgba(245,158,11,0)} }
    .stream { white-space: pre-wrap; word-break: break-word; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
  <div class="max-w-7xl mx-auto p-6">
    <header class="mb-6">
      <h1 class="text-2xl font-bold flex items-center gap-2">🧠 Multi-Agent Agentic OS</h1>
      <p class="text-slate-400 text-sm">ส่งเป้าหมายให้ CEO — มันจะวางแผน มอบหมายงานให้ทีม แล้วสรุปผลแบบเรียลไทม์ (ประวัติถูกบันทึกอัตโนมัติ)</p>
      <p id="conn" class="text-xs mt-1 text-slate-500">กำลังเชื่อมต่อ…</p>
    </header>

    <!-- Session bar -->
    <div class="bg-slate-900 rounded-xl p-3 border border-slate-800 mb-6 flex flex-wrap items-center gap-3">
      <span class="text-sm text-slate-400">เซสชัน:</span>
      <select id="sessionSelect" class="bg-slate-800 rounded-lg px-3 py-1.5 text-sm outline-none focus:ring-2 ring-amber-500"></select>
      <button id="newSession" class="bg-slate-700 hover:bg-slate-600 text-sm px-3 py-1.5 rounded-lg">+ New Session</button>
      <span id="sessionLabel" class="text-xs text-slate-500 ml-auto"></span>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
      <!-- Agents column -->
      <section class="lg:col-span-1">
        <h2 class="text-sm uppercase tracking-wider text-slate-400 mb-3">ทีมเอเจนต์</h2>
        <div id="agents" class="space-y-2"></div>
      </section>

      <!-- Activity column -->
      <section class="lg:col-span-2 flex flex-col gap-4">
        <div class="bg-slate-900 rounded-xl p-4 border border-slate-800">
          <label class="text-sm text-slate-400">คำสั่งถึง CEO</label>
          <div class="flex gap-2 mt-2">
            <input id="goal" type="text"
              class="flex-1 bg-slate-800 rounded-lg px-3 py-2 outline-none focus:ring-2 ring-amber-500"
              placeholder="เช่น Find our best leads and suggest an outreach strategy" />
            <button id="send"
              class="bg-amber-500 hover:bg-amber-400 text-slate-950 font-semibold px-4 py-2 rounded-lg disabled:opacity-50">
              ส่ง
            </button>
          </div>
        </div>

        <div class="bg-slate-900 rounded-xl border border-slate-800">
          <div class="px-4 py-2 border-b border-slate-800 text-sm text-slate-400">กิจกรรม / ผลลัพธ์</div>
          <div id="output" class="p-4 space-y-4 max-h-[60vh] overflow-y-auto"></div>
        </div>
      </section>
    </div>
  </div>

<script>
const AGENTS = {};                 // id -> meta
const cards = {};                  // id -> card element
let liveBlocks = {};               // id -> streaming block (current run only)
let ws;

const statusLabel = { idle:"idle", working:"working", done:"done" };

async function loadAgents() {
  const res = await fetch("/api/agents");
  const data = await res.json();
  const container = document.getElementById("agents");
  data.agents.forEach(a => {
    AGENTS[a.id] = a;
    const card = document.createElement("div");
    card.className = "bg-slate-900 border border-slate-800 rounded-xl p-3 flex items-center gap-3";
    card.innerHTML = `
      <span class="text-2xl">${a.emoji}</span>
      <div class="flex-1">
        <div class="font-semibold">${a.name}</div>
        <div class="text-xs text-slate-400">${a.title}</div>
      </div>
      <div class="flex items-center gap-2">
        <span class="text-xs text-slate-400" data-status>idle</span>
        <span class="w-3 h-3 rounded-full dot-idle" data-dot></span>
      </div>`;
    container.appendChild(card);
    cards[a.id] = card;
  });
}

function meta(id) { return AGENTS[id] || { name: id, emoji: "•" }; }

function setStatus(id, status) {
  const card = cards[id];
  if (!card) return;
  card.querySelector("[data-status]").textContent = statusLabel[status] || status;
  card.querySelector("[data-dot]").className = "w-3 h-3 rounded-full dot-" + status;
}
function resetStatuses() { Object.keys(cards).forEach(id => setStatus(id, "idle")); }

// Create a brand-new block element (used for history + final/plan/error).
function addBlock(emoji, label, text, extraClass = "") {
  const wrap = document.createElement("div");
  wrap.className = "border border-slate-800 rounded-lg overflow-hidden " + extraClass;
  wrap.innerHTML = `
    <div class="px-3 py-2 text-sm font-semibold bg-slate-800/60 flex items-center gap-2">
      <span>${emoji}</span><span>${label}</span>
    </div>
    <div class="p-3 text-sm text-slate-200 stream" data-body></div>`;
  const body = wrap.querySelector("[data-body]");
  body.textContent = text || "";
  document.getElementById("output").appendChild(wrap);
  scrollOut();
  return { wrap, body };
}

// A streaming block keyed by agent for the CURRENT run (chunks append).
function liveBlock(id, label) {
  if (liveBlocks[id]) return liveBlocks[id];
  const a = meta(id);
  liveBlocks[id] = addBlock(a.emoji, label || a.name, "");
  return liveBlocks[id];
}

function scrollOut() {
  const o = document.getElementById("output");
  o.scrollTop = o.scrollHeight;
}

function clearOutput() {
  document.getElementById("output").innerHTML = "";
  liveBlocks = {};
}

function showPlan(subtasks) {
  const block = liveBlock("__plan__", "CEO — แผนการมอบหมายงาน");
  block.body.innerHTML = subtasks.map(s => {
    const a = meta(s.agent);
    return `<div class="mb-1">${a.emoji} <span class="font-semibold">${a.name}</span>: ${s.task}</div>`;
  }).join("");
}

function renderHistory(messages, tasks) {
  clearOutput();
  if ((!messages || !messages.length) && (!tasks || !tasks.length)) {
    addBlock("📭", "ยังไม่มีประวัติในเซสชันนี้", "ส่งคำสั่งถึง CEO เพื่อเริ่มต้น");
    return;
  }
  addBlock("🗂️", "ประวัติเซสชันก่อนหน้า", "ด้านล่างคือกิจกรรมที่บันทึกไว้");
  (messages || []).forEach(m => {
    if (m.role === "user") {
      addBlock("▶️", "เป้าหมาย", m.content, "border-amber-700/60");
    } else if (m.role === "final") {
      addBlock("✅", "ผลลัพธ์สุดท้าย (CEO)", m.content, "border-green-800/60");
    } else {
      const a = meta(m.agent_name);
      addBlock(a.emoji, a.name, m.content);
    }
  });
}

function setBusy(busy) {
  document.getElementById("send").disabled = busy;
  document.getElementById("goal").disabled = busy;
}

function populateSessions(sessions, currentId) {
  const sel = document.getElementById("sessionSelect");
  sel.innerHTML = "";
  sessions.forEach(s => {
    const opt = document.createElement("option");
    opt.value = s.id;
    opt.textContent = `${s.name}  ·  ${s.created_at}`;
    if (currentId != null && s.id === currentId) opt.selected = true;
    sel.appendChild(opt);
  });
}

let currentSessionId = null;

function connect() {
  const proto = location.protocol === "https:" ? "wss" : "ws";
  ws = new WebSocket(`${proto}://${location.host}/ws`);
  ws.onopen = () => { document.getElementById("conn").textContent = "● เชื่อมต่อแล้ว"; };
  ws.onclose = () => {
    document.getElementById("conn").textContent = "○ ตัดการเชื่อมต่อ — กำลังลองใหม่…";
    setTimeout(connect, 1500);
  };
  ws.onmessage = (ev) => handleEvent(JSON.parse(ev.data));
}

function handleEvent(e) {
  switch (e.type) {
    case "sessions":     populateSessions(e.sessions, currentSessionId); break;
    case "session":
      currentSessionId = e.id;
      document.getElementById("sessionLabel").textContent = "กำลังใช้: " + e.name;
      document.getElementById("sessionSelect").value = String(e.id); // re-select if list already there
      break;
    case "history":      renderHistory(e.messages, e.tasks); setBusy(false); break;
    case "plan":         showPlan(e.subtasks); break;
    case "agent_status": setStatus(e.agent, e.status); break;
    case "agent_output": liveBlock(e.agent).body.textContent += e.chunk; scrollOut(); break;
    case "log":          break;
    case "final":        addBlock("✅", "ผลลัพธ์สุดท้าย (CEO)", e.output, "border-green-700"); break;
    case "error":        addBlock("⚠️", "ข้อผิดพลาด", e.message, "border-red-700"); break;
    case "done":         setBusy(false); break;
  }
}

function send() {
  const input = document.getElementById("goal");
  const goal = input.value.trim();
  if (!goal || ws.readyState !== WebSocket.OPEN) return;
  // New run within the same session: keep history above, append new blocks below.
  liveBlocks = {};
  resetStatuses();
  setBusy(true);
  addBlock("▶️", "เป้าหมายใหม่", goal, "border-amber-700/60");
  ws.send(JSON.stringify({ goal }));
  input.value = "";
}

document.getElementById("send").addEventListener("click", send);
document.getElementById("goal").addEventListener("keydown", e => { if (e.key === "Enter") send(); });
document.getElementById("newSession").addEventListener("click", () => {
  if (ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ action: "new_session" }));
});
document.getElementById("sessionSelect").addEventListener("change", (e) => {
  const id = parseInt(e.target.value, 10);
  if (!isNaN(id) && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ action: "load_session", id }));
  }
});

loadAgents().then(connect);
</script>
</body>
</html>
