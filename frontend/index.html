<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Multi-Agent Agentic OS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .dot-idle    { background:#94a3b8; }
    .dot-working { background:#f59e0b; box-shadow:0 0 0 0 rgba(245,158,11,.6); animation:pulse 1.4s infinite; }
    .dot-done    { background:#22c55e; }
    @keyframes pulse { 0%{box-shadow:0 0 0 0 rgba(245,158,11,.6)} 70%{box-shadow:0 0 0 8px rgba(245,158,11,0)} 100%{box-shadow:0 0 0 0 rgba(245,158,11,0)} }
    .stream { white-space: pre-wrap; word-break: break-word; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
  <div class="max-w-7xl mx-auto p-6">
    <header class="mb-6">
      <h1 class="text-2xl font-bold flex items-center gap-2">🧠 Multi-Agent Agentic OS</h1>
      <p class="text-slate-400 text-sm">Send a goal to the CEO. It plans, delegates to specialists, and synthesizes the result — live.</p>
      <p id="conn" class="text-xs mt-1 text-slate-500">connecting…</p>
    </header>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
      <!-- Agents column -->
      <section class="lg:col-span-1">
        <h2 class="text-sm uppercase tracking-wider text-slate-400 mb-3">Agents</h2>
        <div id="agents" class="space-y-2"></div>
      </section>

      <!-- Activity column -->
      <section class="lg:col-span-2 flex flex-col gap-4">
        <!-- Command box -->
        <div class="bg-slate-900 rounded-xl p-4 border border-slate-800">
          <label class="text-sm text-slate-400">Command to CEO</label>
          <div class="flex gap-2 mt-2">
            <input id="goal" type="text"
              class="flex-1 bg-slate-800 rounded-lg px-3 py-2 outline-none focus:ring-2 ring-amber-500"
              placeholder="e.g. Find our best leads and suggest an outreach strategy" />
            <button id="send"
              class="bg-amber-500 hover:bg-amber-400 text-slate-950 font-semibold px-4 py-2 rounded-lg disabled:opacity-50">
              Send
            </button>
          </div>
        </div>

        <!-- Live output -->
        <div class="bg-slate-900 rounded-xl border border-slate-800">
          <div class="px-4 py-2 border-b border-slate-800 text-sm text-slate-400">Live output</div>
          <div id="output" class="p-4 space-y-4 max-h-[60vh] overflow-y-auto"></div>
        </div>
      </section>
    </div>
  </div>

<script>
const AGENTS = {};                 // id -> meta
const cards = {};                  // id -> card element
const outputBlocks = {};           // id -> {wrap, body} streaming panels
let ws;

const statusLabel = { idle:"idle", working:"working", done:"done" };

async function loadAgents() {
  const res = await fetch("/api/agents");
  const data = await res.json();
  const container = document.getElementById("agents");
  data.agents.forEach(a => {
    AGENTS[a.id] = a;
    const card = document.createElement("div");
    card.className = "bg-slate-900 border border-slate-800 rounded-xl p-3 flex items-center gap-3";
    card.innerHTML = `
      <span class="text-2xl">${a.emoji}</span>
      <div class="flex-1">
        <div class="font-semibold">${a.name}</div>
        <div class="text-xs text-slate-400">${a.title}</div>
      </div>
      <div class="flex items-center gap-2">
        <span class="text-xs text-slate-400" data-status>idle</span>
        <span class="w-3 h-3 rounded-full dot-idle" data-dot></span>
      </div>`;
    container.appendChild(card);
    cards[a.id] = card;
  });
}

function setStatus(id, status) {
  const card = cards[id];
  if (!card) return;
  card.querySelector("[data-status]").textContent = statusLabel[status] || status;
  card.querySelector("[data-dot]").className = "w-3 h-3 rounded-full dot-" + status;
}

function resetStatuses() {
  Object.keys(cards).forEach(id => setStatus(id, "idle"));
}

function outputBlock(id, opts = {}) {
  if (outputBlocks[id]) return outputBlocks[id];
  const a = AGENTS[id] || { name: id, emoji: "•" };
  const wrap = document.createElement("div");
  wrap.className = "border border-slate-800 rounded-lg overflow-hidden";
  wrap.innerHTML = `
    <div class="px-3 py-2 text-sm font-semibold bg-slate-800/60 flex items-center gap-2">
      <span>${a.emoji}</span><span>${opts.label || a.name}</span>
    </div>
    <div class="p-3 text-sm text-slate-200 stream" data-body></div>`;
  document.getElementById("output").appendChild(wrap);
  const block = { wrap, body: wrap.querySelector("[data-body]") };
  outputBlocks[id] = block;
  return block;
}

function appendChunk(id, chunk) {
  const block = outputBlock(id);
  block.body.textContent += chunk;
  document.getElementById("output").scrollTop = document.getElementById("output").scrollHeight;
}

function showPlan(subtasks) {
  const block = outputBlock("__plan__", { label: "CEO — Delegation Plan" });
  block.body.innerHTML = subtasks.map(s => {
    const a = AGENTS[s.agent] || { name: s.agent, emoji: "•" };
    return `<div class="mb-1">${a.emoji} <span class="font-semibold">${a.name}</span>: ${s.task}</div>`;
  }).join("");
}

function setBusy(busy) {
  document.getElementById("send").disabled = busy;
  document.getElementById("goal").disabled = busy;
}

function connect() {
  const proto = location.protocol === "https:" ? "wss" : "ws";
  ws = new WebSocket(`${proto}://${location.host}/ws`);
  ws.onopen = () => { document.getElementById("conn").textContent = "● connected"; };
  ws.onclose = () => {
    document.getElementById("conn").textContent = "○ disconnected — retrying…";
    setTimeout(connect, 1500);
  };
  ws.onmessage = (ev) => handleEvent(JSON.parse(ev.data));
}

function handleEvent(e) {
  switch (e.type) {
    case "plan":         showPlan(e.subtasks); break;
    case "agent_status": setStatus(e.agent, e.status); break;
    case "agent_output": appendChunk(e.agent, e.chunk); break;
    case "log":          /* lightweight progress note */ outputBlock(e.agent); break;
    case "final": {
      const block = outputBlock("__final__", { label: "✅ Final Deliverable (CEO)" });
      block.wrap.classList.add("border-green-700");
      block.body.textContent = e.output;
      break;
    }
    case "error": {
      const block = outputBlock("__error__", { label: "⚠️ Error" });
      block.wrap.classList.add("border-red-700");
      block.body.textContent = e.message;
      break;
    }
    case "done": setBusy(false); break;
  }
}

function send() {
  const input = document.getElementById("goal");
  const goal = input.value.trim();
  if (!goal || ws.readyState !== WebSocket.OPEN) return;
  // fresh run: clear output panels and reset statuses
  document.getElementById("output").innerHTML = "";
  Object.keys(outputBlocks).forEach(k => delete outputBlocks[k]);
  resetStatuses();
  setBusy(true);
  ws.send(JSON.stringify({ goal }));
}

document.getElementById("send").addEventListener("click", send);
document.getElementById("goal").addEventListener("keydown", e => { if (e.key === "Enter") send(); });

loadAgents().then(connect);
</script>
</body>
</html>
